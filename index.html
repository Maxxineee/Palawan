<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Fees and Clearance System</title>
    <link rel="stylesheet" href="css/style.css">
    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 0;
            padding: 0;
            background: linear-gradient(to bottom, #FFEB3B, #FFFFFF, #FF9800); /* Yellow gradient */
        }
        .header {
            display: flex;
            align-items: center;
            padding: 20px;
            background-color: #FFCC00; /* Solid yellow background for header */
            color: white;
            box-shadow: 0 4px 6px rgba(0, 0, 0, 0.1);
            border-bottom: 3px solid #000000; /* Horizontal line under the header */
            z-index: 2; /* Ensures the header stays above other content */
            position: relative; /* Keeps the header above the navbar */
        }
        .header img {
            height: 50px;
            margin-right: 20px;
        }
        .header h1 {
            font-size: 40px;
            margin: 0;
        }
        .navbar {
            display: flex;
            flex-direction: column;
            padding: 15px 0;
            width: 150px;
            background-color: #f5a018; /* Light orange background for the navbar */
            border-right: 3px solid #000000; /* Vertical line for separation */
            box-shadow: 2px 0 5px rgba(0, 0, 0, 0.1); /* Optional shadow effect for depth */
            position: fixed; /* Fix navbar on the left */
            top: 0;
            left: 0;
            bottom: 0;
            z-index: 1; /* Keep the navbar below the header */
        }
        
        .navbar a {
            color: white;
            text-decoration: none;
            margin: 10px 0;
            padding: 10px 15px;
            display: flex;
            align-items: center;
            transition: background-color 0.3s;
        }
        .navbar a img {
            margin-right: 10px;
            height: 50px; /* Set all icons to the same size */
        }
        .navbar a:hover {
            background-color: #FFCC00; /* Hover effect for navbar links */
            border-radius: 5px;
        }

        /* Adjusting the navbar's position lower */
        .navbar a:nth-child(1) { margin-top: 150px; }  /* Move "Home" link lower */
        .navbar a:nth-child(2) { margin-top: 20px; }  /* Move "Student Profile" link lower */
        .navbar a:nth-child(3) { margin-top: 20px; }  /* Move "Sign Out" link lower */

        .main-content {
            margin-left: 180px; /* Adjusted to account for the navbar */
            padding: 20px;
            color: #333;
            margin-top: 60px; /* Reduced top margin to ensure the content is below the header */
        }
        .greeting {
            font-size: 40px;
            color: #333;
            font-style: normal;
        }
        .transparent-box {
            background-color: rgba(255, 255, 255, 0.9); /* White background with slight transparency */
            padding: 20px;
            border-radius: 10px;
            margin-top: 20px;
            box-shadow: 0 4px 6px rgba(0, 0, 0, 0.1);
        }
        .transparent-box p {
            font-size: 30px; /* Increase font size for the clearance message */
            color: #020202; /* Color for the warning text */
            font-weight: bold;
        }
        .fee-section {
            display: flex;
            justify-content: space-between;
            margin-top: 20px;
        }
        .fee-box {
            display: flex;
            flex-direction: column;
            align-items: center;
            background-color: #FFEB3B; /* Light yellow for fee boxes */
            padding: 40px 30px; /* Increased padding for larger boxes */
            border-radius: 10px;
            width: 250px; /* Increased width */
            height: 150px; /* Increased height */
            text-align: center;
            box-shadow: 0 4px 8px rgba(0, 0, 0, 0.1);
            transition: transform 0.2s; /* Added hover effect */
        }
        .fee-box img {
            height: 40px; /* Slightly larger icons */
            margin-bottom: 15px;
        }
        .fee-box a {
            text-decoration: none;
            color: #333;
            font-size: 18px; /* Increased font size */
        }
        .fee-box:hover {
            transform: scale(1.05); /* Slight zoom effect on hover */
        }
        a {
            text-decoration: none;
        }

    </style>
</head>
<body>
    <!-- Header Section with Logo and Title -->
    <div class="header">
        <img src="img/logo.png" alt="Logo" style="height: 100px; margin-right: 0px;"> <!-- Replace with actual logo image -->
        <h1>Fees and Clearance System</h1>
    </div>

    <!-- Navbar -->
    <div class="navbar">
        <a href="home.html"><img src="img/home.png" alt="Home"> Home</a>
        <a href="studprof.html"><img src="img/prof.png" alt="Profile"> Student Profile</a>
        <!-- Sign Out link with JavaScript for redirection -->
        <a href="javascript:void(0);" onclick="signOut()"><img src="img/out.png" alt="Sign Out"> Sign Out</a>
    </div>
    

    <!-- Main Content Section -->
    <div class="main-content">
        <!-- Greeting Message -->
        <div class="greeting">
            <p>Welcome Back, Ka-Pinansyalista (User Name)</p> <!-- User's name will dynamically populate -->
        </div>

        <!-- Transparent Box with Fee Information -->
        <div class="transparent-box">
            <p><img src="img/warn.png" alt="Warning" style="height: 100px; margin-right: 0px;"> Your clearance is not yet complete. You have pending fees.</p>

            <!-- Fee Section with Clickable Boxes -->
            <div class="fee-section">
                <div class="fee-box">
                    <img src="img/coin.png" alt="CSG Fee" style="height: 100px; margin-right: 10px;"> <!-- Replace with actual icon -->
                    <span>CSG Fee: PHP 150</span>
                </div>
                <div class="fee-box">
                    <img src="img/coin.png" alt="USG Fee" style="height: 100px; margin-right: 10px;"> <!-- Replace with actual icon -->
                    <span>USG Fee: PHP 120</span>
                </div>
                <div class="fee-box">
                    <img src="img/coin.png" alt="Maintenance Fee" style="height: 100px; margin-right: 10px;"> <!-- Replace with actual icon -->
                    <span>Maintenance Fee: PHP 100</span>
                </div>
            </div>
            <!-- Proceed to Payment Button -->
            <a href="pay.html" style="display: block; margin-top: 20px; padding: 10px 20px; background-color: #FFEB3B; color: white; text-align: center; border-radius: 5px;">Proceed to Payment</a>
        </div>

    </div>

    <script>
        function signOut() {
            // Clear session or perform other sign-out actions here
            window.location.href = "greet.html"; // Redirect to login page
        }
    </script>
</body>
</html>
